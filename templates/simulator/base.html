<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django War Simulator{% endblock %}</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121417; color: #e9ecef;
               max-width: 860px; margin: 0 auto 3rem; padding: 0 1rem; }
        nav { display: flex; gap: 1.25rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid #2d323b;
              margin-bottom: 1.5rem; }
        nav .brand { font-weight: 800; margin-right: auto; }
        nav a, a.btn-link { color: #58a6ff; text-decoration: none; font-weight: 600; }
        h1 { margin-top: 0; }
        .alert { padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem;
                 background: #193b2d; border: 1px solid #2ea043; color: #7ee787; }
        .alert-error { background: #3d1c20; border-color: #f85149; color: #ffa198; }
        .box { background: #1c1f24; border: 1px solid #2d323b; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
        .btn { border: none; padding: .5rem .95rem; border-radius: 5px; font-weight: 600; cursor: pointer; color: #fff; }
        .btn-green { background: #238636; } .btn-green:hover { background: #2ea043; }
        .btn-red { background: #da3633; } .btn-red:hover { background: #f85149; }
        .btn-grey { background: #30363d; } .btn-grey:hover { background: #3d444d; }
        .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .75rem;
                 font-weight: 700; margin-left: .4rem; }
        .badge-Blue { background: #132f4c; color: #66b2ff; border: 1px solid #1e4976; }
        .badge-Red { background: #42181d; color: #ff7b72; border: 1px solid #6e242c; }
        .muted { color: #8b949e; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid #2d323b; }
        th { color: #8b949e; font-size: .8rem; text-transform: uppercase; }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <nav>
        <span class="brand">⚔️ War Simulator</span>
        <a href="{% url 'unit_create' %}">Add fighter</a>
        <a href="{% url 'unit_list' %}">All fighters</a>
        <a href="{% url 'people' %}">Draft office</a>
    </nav>

    {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-error{% endif %}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
</body>
</html>
